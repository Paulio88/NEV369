[package]
name = "nev369-node"
version = "0.3.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
pqc_dilithium = "0.2.0"
tokio = { version = "1.40", features = ["full"] }
sled = "0.34"
bincode = "1.3"
uuid = { version = "1.10", features = ["v4"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "identify",
    "ping",
    "macros",
    "quic"
] }
